<!--
  Zendesk macro search for colleagues (issue #9). Open this file in a browser
  and load macros.json and groups.json. Nothing to install.

  The page sends nothing over the network: the Content-Security-Policy below
  allows no connections, and only the one script whose SHA-256 hash it names.
  After you change the script, test_macro_search_html.py prints the new hash.

  This file repeats the search rules of macro_search.py. Change both apps in
  the same pull request, and add a case to test_cases/search.json.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-BlLtS96nKX9EszIdgNylEwnkIxxM8lLv+8nmkEviyMc='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zendesk macros</title>
<style>
body { font: 16px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 60rem; padding: 1rem 1.5rem 3rem; color: #1d1d1f; }
a { color: #0b57d0; }
h1 { font-size: 1.4rem; margin: .5rem 0 1rem; }
form.search { display: flex; gap: .5rem; margin-bottom: .5rem; }
form.search input[type=search] { flex: 1 1 auto; font-size: 1.1rem; padding: .5rem .7rem; }
button { font-size: .95rem; padding: .3rem .6rem; }
.chip { display: inline-block; font-size: .8rem; line-height: 1.5; padding: 0 .55rem; border-radius: 999px; background: #eef3fb; color: #1e4f91; text-decoration: none; border: 1px solid transparent; white-space: nowrap; }
.chip:hover { border-color: #1e4f91; }
.chip.on { background: #1e4f91; color: #fff; }
.chip .n { opacity: .7; margin-left: .3rem; }
.tags { display: flex; flex-wrap: wrap; gap: .3rem; margin: .3rem 0 .5rem; }
.selected { margin: .5rem 0; line-height: 2; }

details.tagpicker > summary { cursor: pointer; font-weight: 600; }

mark { background: #ffe58a; }
.dc { background: #ffd6ec; color: #8c1257; border-radius: .2rem; padding: 0 .1rem; }

/* html app only */

.drop.over { border-color: #0b57d0; background: #f0f5ff; }

</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
(() => {
  const SUBDOMAIN = "tbpro";
  const WEIGHTS = [10, 3, 1, 5];          // title, description, reply, tags
  const TAG_FIELDS = ["current_tags", "set_tags"];
  const HIT_START = "\x02", HIT_END = "\x03";
  const MAX_RESULTS = 500;
  const SNIPPET_TOKENS = 24;
  const K1 = 1.2, B = 0.75;               // the SQLite FTS5 bm25() constants

  // --- macro text (macro_search.py: html_to_text, reply_text, tags) --------

  const BLOCK = new Set(["p", "div", "br", "li", "tr", "ul", "ol", "table", "blockquote",
                         "pre", "h1", "h2", "h3", "h4", "h5", "h6", "hr"]);
  const SKIP = new Set(["script", "style"]);

  // " (URL)" after the text of a link, or "" if the text is the URL (issue #13).
  function linkSuffix(text, href) {
    href = href.trim();
    const label = text.split(/\s+/).filter((w) => w).join(" ");
    if (!href || href === label || href === "mailto:" + label) return "";
    return ` (${href})`;
  }

  function htmlToText(source) {
    // DOMParser documents are inert: no scripts run and no images load.
    const doc = new DOMParser().parseFromString(source, "text/html");
    const parts = [];
    const walk = (node) => {
      for (const child of node.childNodes) {
        if (child.nodeType === Node.TEXT_NODE) { parts.push(child.data); continue; }
        if (child.nodeType !== Node.ELEMENT_NODE) continue;
        const tag = child.localName;
        if (SKIP.has(tag)) continue;
        const block = BLOCK.has(tag);
        if (block) {
          if (!(parts.length && parts[parts.length - 1] === "- ")) parts.push("\n");
          if (tag === "li") parts.push("- ");
        }
        const start = parts.length;
        walk(child);
        if (tag === "a") parts.push(linkSuffix(parts.slice(start).join(""), child.getAttribute("href") || ""));
        if (block && tag !== "br" && tag !== "hr") parts.push("\n");
      }
    };
    walk(doc.body);
    return parts.join("")
      .replace(/[ \t\r\f\v\xa0]+/g, " ")
      .replace(/ *\n */g, "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  const clean = (text) => text.replaceAll(HIT_START, "").replaceAll(HIT_END, "");

  function asText(value) {
    if (value === null || value === undefined) return "";
    if (Array.isArray(value)) return value.map(asText).join(" ");
    return String(value);
  }

  const actions = (macro) => (Array.isArray(macro.actions) ? macro.actions : [])
    .filter((a) => a && typeof a === "object");

  function replyText(macro) {
    const parts = [];
    for (const a of actions(macro)) {
      if (a.field === "comment_value_html") parts.push(htmlToText(asText(a.value)));
      else if (a.field === "comment_value") parts.push(asText(a.value).trim());
    }
    return parts.filter((p) => p).join("\n\n");
  }

  function tags(macro) {
    const found = [];
    for (const a of actions(macro)) {
      if (TAG_FIELDS.includes(a.field)) found.push(...asText(a.value).split(/\s+/).filter((t) => t));
    }
    return found;
  }

  function groupIds(macro) {
    const r = macro.restriction || {};
    if (r.type !== "Group") return [];
    return Array.isArray(r.ids) && r.ids.length ? [...r.ids] : (r.id ? [r.id] : []);
  }

  const NO_CATEGORY = "::";  // filter value for titles without a category

  // The text before the first "::" in the title, or "" without one (issue #11).
  function macroCategory(macro) {
    const title = asText(macro.title);
    const i = title.indexOf("::");
    return i >= 0 ? title.slice(0, i).trim() : "";
  }

  // --- query and matching (macro_search.py: the same section) ---------------

  const TOKEN_RE = /[\p{L}\p{N}]+/gu;
  const norm = (token) => token.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();

  function queryTerms(text) {
    const terms = [];
    for (const m of text.matchAll(/"([^"]*)"|(\S+)/g)) {
      const quoted = m[1];
      const parts = (quoted || m[2] || "").match(TOKEN_RE) || [];
      if (parts.length) terms.push([parts, !quoted]);
    }
    return terms;
  }

  const tokensWithSpans = (text) =>
    [...text.matchAll(TOKEN_RE)].map((m) => [m.index, m.index + m[0].length, norm(m[0])]);

  function phraseStarts(tokens, phrase, prefix) {
    const n = phrase.length, starts = [];
    for (let i = 0; i + n <= tokens.length; i++) {
      let ok = true;
      for (let k = 0; k < n - 1; k++) if (tokens[i + k] !== phrase[k]) { ok = false; break; }
      const last = tokens[i + n - 1];
      if (ok && (prefix ? last.startsWith(phrase[n - 1]) : last === phrase[n - 1])) starts.push(i);
    }
    return starts;
  }

  function hitRanges(toks, terms) {
    const words = toks.map((t) => t[2]);
    const ranges = [];
    for (const [parts, prefix] of terms) {
      for (const i of phraseStarts(words, parts.map(norm), prefix)) ranges.push([i, i + parts.length - 1]);
    }
    ranges.sort((x, y) => (x[0] - y[0]) || (x[1] - y[1]));
    const merged = [];
    for (const [a, b] of ranges) {
      const lastRange = merged[merged.length - 1];
      if (lastRange && a <= lastRange[1] + 1) lastRange[1] = Math.max(lastRange[1], b);
      else merged.push([a, b]);
    }
    return merged;
  }

  function markRanges(text, toks, ranges, first, last, cs, ce) {
    const out = [];
    let pos = cs;
    for (let [a, b] of ranges) {
      a = Math.max(a, first); b = Math.min(b, last);
      if (a > b) continue;
      const s = toks[a][0], e = toks[b][1];
      out.push(text.slice(pos, s), HIT_START, text.slice(s, e), HIT_END);
      pos = e;
    }
    out.push(text.slice(pos, ce));
    return out.join("");
  }

  // Python str.isspace() and JavaScript \s agree on the usual spaces.
  function spaceBefore(text, pos) {
    while (pos > 0 && !/\s/.test(text[pos - 1])) pos--;
    return pos;
  }

  function spaceAfter(text, pos) {
    while (pos < text.length && !/\s/.test(text[pos])) pos++;
    return pos;
  }

  function highlight(text, terms) {
    const toks = tokensWithSpans(text);
    return markRanges(text, toks, hitRanges(toks, terms), 0, toks.length - 1, 0, text.length);
  }

  function snippet(text, terms, size = SNIPPET_TOKENS) {
    const toks = tokensWithSpans(text);
    if (!toks.length) return "";
    const ranges = hitRanges(toks, terms);
    const hitSet = new Set();
    for (const [a, b] of ranges) for (let i = a; i <= b; i++) hitSet.add(i);
    const hits = [...hitSet].sort((x, y) => x - y);
    let start = 0, best = -1;
    for (const s of [...new Set(hits.map((h) => Math.max(0, h - 3)))].sort((x, y) => x - y)) {
      const count = hits.filter((h) => s <= h && h < s + size).length;
      if (count > best) { start = s; best = count; }
    }
    start = Math.max(0, Math.min(start, toks.length - size));
    const end = Math.min(toks.length, start + size);
    // Cut at spaces, not inside a word such as "you'd" or "{{ticket.requester.first_name}}".
    const cs = start === 0 ? 0 : spaceBefore(text, toks[start][0]);
    const ce = end === toks.length ? text.length : spaceAfter(text, toks[end - 1][1]);
    const body = markRanges(text, toks, ranges, start, end - 1, cs, ce);
    return (start > 0 ? "…" : "") + body + (end < toks.length ? "…" : "");
  }

  function shorten(text, limit = 220) {
    const t = text.split(/\s+/).filter((w) => w).join(" ");
    const chars = Array.from(t);
    if (chars.length <= limit) return t;
    const cut = chars.slice(0, limit).join("");
    const i = cut.lastIndexOf(" ");
    return (i >= 0 ? cut.slice(0, i) : cut) + " …";
  }

  // --- tag filters and sorting (macro_search.py: the same section) ----------
  //
  // A search URL holds the query, the selected values of each tag group, the
  // view, and the sort (issue #15). A URL can repeat a group parameter.

  const FACETS = [["category", "Category"], ["group", "Available for"], ["status", "Status"],
                  ["field", "Changes field"], ["tag", "Zendesk tags"]];
  const STATUSES = ["active", "inactive"];
  const SORTS = ["title", "category", "group", "updated"];
  const OPEN_GROUP_LIMIT = 30;  // a tag group with more values starts collapsed

  const unique = (values) => [...new Set(values)];

  // The values that a macro has in a tag group.
  function facetValues(macro, key) {
    if (key === "category") return [macroCategory(macro) || NO_CATEGORY];
    if (key === "group") {
      const ids = groupIds(macro).map(String);
      return ids.length ? ids : ["none"];
    }
    if (key === "status") return [macro.active ? "active" : "inactive"];
    if (key === "field") return unique(actions(macro).map((a) => a.field).filter((f) => f));
    return unique(tags(macro));
  }

  // Letter case does not matter for a category (issue #11).
  const sameValue = (key, a, b) => (key === "category" ? a.toLowerCase() === b.toLowerCase() : a === b);

  // The selected values of each tag group, from URLSearchParams, FormData, or
  // an object of value lists. Empty values, repeats, and unknown statuses,
  // for example the old "all", are left out.
  function parseFilters(source) {
    const all = (key) => {
      if (typeof source.getAll === "function") return source.getAll(key);
      const raw = source[key];
      if (!raw || (Array.isArray(raw) && !raw.length)) return [];
      return Array.isArray(raw) ? raw : [raw];
    };
    const filters = {};
    for (const [key] of FACETS) {
      const chosen = [];
      for (const raw of all(key)) {
        const value = asText(raw);
        if (!value || (key === "status" && !STATUSES.includes(value))) continue;
        if (!chosen.some((c) => sameValue(key, value, c))) chosen.push(value);
      }
      if (chosen.length) filters[key] = chosen;
    }
    return filters;
  }

  // One of the selected values inside each group (OR), and every group (AND).
  const matches = (macro, filters) => Object.entries(filters).every(([key, chosen]) =>
    facetValues(macro, key).some((v) => chosen.some((s) => sameValue(key, v, s))));

  function withValue(filters, key, value) {
    const chosen = filters[key] || [];
    return chosen.some((c) => sameValue(key, value, c)) ? filters : { ...filters, [key]: [...chosen, value] };
  }

  function withoutValue(filters, key, value) {
    const out = {};
    for (const [k, vs] of Object.entries(filters)) {
      const kept = vs.filter((v) => !(k === key && sameValue(key, v, value)));
      if (kept.length) out[k] = kept;
    }
    return out;
  }

  const parseSort = (value) =>
    (SORTS.includes(value.replace(/^-/, "")) && (value.match(/-/g) || []).length <= 1 ? value : "");

  // The sort after a click on a column heading. Updated starts with the newest.
  function nextSort(current, column) {
    if (current === column) return "-" + column;
    if (current === "-" + column) return column;
    return column === "updated" ? "-updated" : column;
  }

  // The query string of a search page, without "?". The list view is the default.
  function searchQuery(q, filters, view = "", sort = "", picker = false) {
    const qs = new URLSearchParams();
    if (q) qs.append("q", q);
    for (const [key] of FACETS) for (const v of filters[key] || []) qs.append(key, v);
    if (view === "table") qs.append("view", "table");
    if (sort) qs.append("sort", sort);
    if (picker) qs.append("picker", "open");
    return qs.toString();
  }

  // --- index (macro_search.py: MacroIndex) ----------------------------------

  let index = null;

  function buildIndex(macros, groups, exportedAt) {
    const byId = new Map();
    for (const m of macros) byId.set(m.id, m);
    const groupNames = new Map();
    for (const g of groups) {
      if (g && "id" in g) groupNames.set(g.id, (g.name || String(g.id)) + (g.deleted ? " (deleted)" : ""));
    }
    const docs = new Map(), replies = new Map();
    let total = 0;
    for (const [id, m] of byId) {
      const reply = clean(replyText(m));
      replies.set(id, reply);
      const cols = [clean(m.title || ""), clean(m.description || ""), reply, clean(tags(m).join(" "))]
        .map((t) => tokensWithSpans(t).map((x) => x[2]));
      const len = cols.reduce((n, c) => n + c.length, 0);
      total += len;
      docs.set(id, { cols, len });
    }
    const lower = (id) => (byId.get(id).title || "").toLowerCase();
    const order = [...byId.keys()].sort((a, b) => (lower(a) < lower(b) ? -1 : lower(a) > lower(b) ? 1 : 0));
    return { macros: byId, groupNames, docs, replies, total, order, exportedAt };
  }

  const groupName = (gid) => (index.groupNames.has(gid) ? index.groupNames.get(gid) : String(gid));

  function availableFor(macro) {
    const ids = groupIds(macro);
    return ids.length ? ids.map(groupName).join(", ") : "All agents";
  }

  const adminUrl = (id) => `https://${SUBDOMAIN}.zendesk.com/admin/workspaces/agent-workspace/macros/${id}`;

  function groupChoices() {
    const counts = new Map();
    let unrestricted = 0;
    for (const m of index.macros.values()) {
      const ids = groupIds(m);
      if (!ids.length) unrestricted++;
      for (const g of ids) counts.set(g, (counts.get(g) || 0) + 1);
    }
    const rest = [...counts].map(([g, n]) => [String(g), groupName(g), n]);
    const key = (c) => c[1].toLowerCase();
    rest.sort((x, y) => (key(x) < key(y) ? -1 : key(x) > key(y) ? 1 : 0));
    return [["none", "All agents (no restriction)", unrestricted], ...rest];
  }

  function fieldChoices() {
    const counts = new Map();
    for (const m of index.macros.values()) {
      for (const f of new Set(actions(m).map((a) => a.field).filter((f) => f))) {
        counts.set(f, (counts.get(f) || 0) + 1);
      }
    }
    return [...counts].sort((x, y) => (x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0));
  }

  // Letter case does not matter. The label is the spelling of the first macro in title order.
  function categoryChoices() {
    const labels = new Map(), counts = new Map();
    for (const id of index.order) {
      const c = macroCategory(index.macros.get(id)), k = c.toLowerCase();
      if (!labels.has(k)) labels.set(k, c);
      counts.set(k, (counts.get(k) || 0) + 1);
    }
    const choices = [...counts].filter(([k]) => k).map(([k, n]) => [labels.get(k), n]);
    const key = (c) => c[0].toLowerCase();
    choices.sort((x, y) => (key(x) < key(y) ? -1 : key(x) > key(y) ? 1 : 0));
    if (counts.has("")) choices.push([NO_CATEGORY, counts.get("")]);
    return choices;
  }

  // The text of a tag chip.
  function valueLabel(key, value) {
    if (key === "category") return categoryLabel(value);
    if (key === "group") {
      if (value === "none") return "All agents";
      return /^\d+$/.test(value) ? groupName(Number(value)) : value;
    }
    return value;
  }

  function sortKey(macro, column) {
    if (column === "title") return asText(macro.title).toLowerCase();
    if (column === "category") return macroCategory(macro).toLowerCase();
    if (column === "group") return availableFor(macro).toLowerCase();
    return asText(macro.updated_at);
  }

  // [key, label, [[value, label, count]]] of each tag group with values.
  // The counts are over all macros, not over the results.
  function facetChoices() {
    const counts = Object.fromEntries(FACETS.map(([key]) => [key, new Map()]));
    for (const m of index.macros.values()) {
      for (const [key] of FACETS.slice(1)) {
        for (const v of facetValues(m, key)) counts[key].set(v, (counts[key].get(v) || 0) + 1);
      }
    }
    counts.category = new Map(categoryChoices());  // letter case does not matter
    const byCode = (x, y) => (x < y ? -1 : x > y ? 1 : 0);
    const order = {
      category: [...counts.category.keys()],
      group: groupChoices().map((c) => c[0]).filter((g) => counts.group.has(g)),
      status: STATUSES.filter((v) => counts.status.has(v)),
      field: [...counts.field.keys()].sort(byCode),
      tag: [...counts.tag.keys()].sort(byCode),
    };
    return FACETS.filter(([key]) => order[key].length)
      .map(([key, label]) => [key, label, order[key].map((v) => [v, valueLabel(key, v), counts[key].get(v)])]);
  }

  function search(q = "", filters = {}, sort = "") {
    filters = parseFilters(filters || {});
    sort = parseSort(sort || "");
    const terms = queryTerms(q);
    let rows;
    if (terms.length) {
      // SQLite FTS5 bm25(): every phrase must match; a phrase can match in
      // any column; column weights multiply the hit counts.
      const phrases = terms.map(([parts, prefix]) => [parts.map(norm), prefix]);
      const n = index.docs.size, avgdl = index.total / n;
      const hitsByDoc = new Map(), nHit = phrases.map(() => 0);
      for (const [id, d] of index.docs) {
        const counts = phrases.map(([p, prefix]) => d.cols.map((col) => phraseStarts(col, p, prefix).length));
        counts.forEach((cs, i) => { if (cs.some((c) => c > 0)) nHit[i]++; });
        hitsByDoc.set(id, counts);
      }
      const idf = nHit.map((h) => { const v = Math.log((n - h + 0.5) / (h + 0.5)); return v <= 0 ? 1e-6 : v; });
      const scored = [];
      for (const [id, counts] of hitsByDoc) {
        if (!counts.every((cs) => cs.some((c) => c > 0))) continue;
        const D = index.docs.get(id).len;
        let score = 0;
        counts.forEach((cs, i) => {
          const f = cs.reduce((sum, c, col) => sum + WEIGHTS[col] * c, 0);
          score += idf[i] * ((f * (K1 + 1.0)) / (f + K1 * (1 - B + B * D / avgdl)));
        });
        scored.push([id, score]);
      }
      scored.sort((x, y) => (y[1] - x[1]) || (x[0] - y[0]));
      rows = scored.map(([id]) => [id, highlight(clean(index.macros.get(id).title || ""), terms),
                                   snippet(index.replies.get(id), terms)]);
    } else {
      rows = index.order.map((id) => [id, index.macros.get(id).title || "", shorten(index.replies.get(id))]);
    }
    if (sort) {
      // A stable sort: equal keys keep the rank or title order.
      const column = sort.replace(/^-/, ""), dir = sort.startsWith("-") ? -1 : 1;
      const keyed = rows.map((r) => [sortKey(index.macros.get(r[0]), column), r]);
      keyed.sort((x, y) => dir * (x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0));
      rows = keyed.map((x) => x[1]);
    }
    return rows.filter(([id]) => matches(index.macros.get(id), filters))
      .map(([id, title, snip]) => ({ id, title, snippet: snip, macro: index.macros.get(id) }));
  }

  // --- rendering (macro_search.py: pages) -----------------------------------

  const esc = (value) => asText(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#x27;");

  const DYNAMIC = /\{\{[^{}]*\}\}|\{%[\s\S]*?%\}/g;
  const FILL_IN = /\[\[[^\[\]]*\]\]/g;
  const PARTIAL = /\{\{[^{}]*…$|^…[^{}]*\}\}/g;
  const PARTIAL_FILL = /\[\[[^\[\]]*…$|^…[^\[\]]*\]\]/g;

  const dynamic = (escaped) => escaped.replace(DYNAMIC, (m) => `<span class="dc">${m}</span>`);
  const fillIn = (escaped) => escaped.replace(FILL_IN, (m) => `<span class="fill">${m}</span>`);
  const show = (value) => fillIn(dynamic(esc(value)));

  // URLs that the detail page makes clickable. Other schemes, for example
  // javascript:, stay plain text.
  const URL_RE = /(?:https?:\/\/|mailto:)[^\s<>"']+/gi;
  const URL_START = /^(?:https?:\/\/|mailto:)./i;

  // Cut a URL at a ")" without its "(", and remove punctuation at the end.
  function trimUrl(url) {
    let depth = 0;
    for (let i = 0; i < url.length; i++) {
      if (url[i] === "(") depth++;
      else if (url[i] === ")") {
        if (!depth) { url = url.slice(0, i); break; }
        depth--;
      }
    }
    return url.replace(/[.,;:!?]+$/, "");
  }

  // show() for the reply text, with every http, https, and mailto URL as a link.
  function linked(text) {
    const out = [];
    let pos = 0;
    for (const m of text.matchAll(URL_RE)) {
      const url = trimUrl(m[0]);
      if (!URL_START.test(url)) continue;
      out.push(show(text.slice(pos, m.index)));
      out.push(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${show(url)}</a>`);
      pos = m.index + url.length;
    }
    out.push(show(text.slice(pos)));
    return out.join("");
  }

  function marked(text) {
    let h = show(text).replace(PARTIAL, (m) => `<span class="dc">${m}</span>`);
    h = h.replace(PARTIAL_FILL, (m) => `<span class="fill">${m}</span>`);
    return h.replaceAll(HIT_START, "<mark>").replaceAll(HIT_END, "</mark>");
  }

  function exportLabel(value) {
    if (typeof value !== "string" || !/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(value)) return "";
    return `Macros exported ${value.slice(0, 10)} ${value.slice(11, 16)} UTC`;
  }

  const statusBadge = (m) => (m.active ? '<span class="badge active">active</span>'
                                       : '<span class="badge inactive">inactive</span>');

  const zendeskLink = (id) =>
    `<a href="${esc(adminUrl(id))}" target="_blank" rel="noopener noreferrer">Open in Zendesk</a>`;

  const categoryLabel = (value) => (value === NO_CATEGORY ? "(no category)" : value);

  function chip(label, href, on = false, count = null, title = "") {
    return `<a class="chip${on ? " on" : ""}" href="${esc(href)}"` + (title ? ` title="${esc(title)}"` : "") +
      `>${esc(label)}` + (count !== null ? `<span class="n">${count}</span>` : "") + "</a>";
  }

  // The query, tag filters, view, and sort of a search page (issue #15).
  function searchState(params) {
    const st = {
      q: params.get("q") || "",
      filters: parseFilters(params),
      view: params.get("view") === "table" ? "table" : "list",
      sort: parseSort(params.get("sort") || ""),
      picker: params.get("picker") === "open",
    };
    st.url = ({ filters = st.filters, view = st.view, sort = st.sort, picker = false } = {}) => {
      const qs = searchQuery(st.q, filters, view, sort, picker);
      return qs ? `#/?${qs}` : "#/";
    };
    st.selected = (key, value) => (st.filters[key] || []).some((c) => sameValue(key, value, c));
    return st;
  }

  // "Category: Billing ✕ or Donation ✕ · Status: active ✕ · Clear all"
  function selectedRow(st) {
    if (!Object.keys(st.filters).length) return "";
    const parts = [];
    for (const [key, label] of FACETS) {
      const chips = (st.filters[key] || []).map((v) =>
        chip(`${valueLabel(key, v)} ✕`, st.url({ filters: withoutValue(st.filters, key, v), picker: st.picker }),
             true, null, "Remove"));
      if (chips.length) parts.push(`${esc(label)}: ` + chips.join(" or "));
    }
    const clear = `<a href="${esc(st.url({ filters: {}, picker: st.picker }))}">Clear all</a>`;
    return `<p class="selected">${parts.join(" · ")} · ${clear}</p>`;
  }

  // All tag groups in a collapsed section. A click on a chip selects or removes it.
  function tagPicker(st) {
    const groups = facetChoices().map(([key, label, choices]) => {
      const chips = choices.map(([v, text, n]) =>
        chip(text, st.url({ filters: (st.selected(key, v) ? withoutValue : withValue)(st.filters, key, v), picker: true }),
             st.selected(key, v), n)).join("");
      const expanded = key in st.filters || choices.length <= OPEN_GROUP_LIMIT;
      return `<details class="tag-group"${expanded ? " open" : ""}>` +
        `<summary>${esc(label)} (${choices.length})</summary><div class="tags">${chips}</div></details>`;
    });
    return `<details class="tagpicker"${st.picker ? " open" : ""}><summary>Filter by tag</summary>` +
      groups.join("") + "</details>";
  }

  // Chips for a result. A click adds the value to the filter.
  const macroChips = (st, macro, keys = ["category", "group", "tag"]) => keys
    .filter((key) => facetValues(macro, key).length)
    .map((key) => facetValues(macro, key).map((v) =>
      chip(valueLabel(key, v), st.url({ filters: withValue(st.filters, key, v) }), st.selected(key, v))).join(" "));

  function viewToggle(st) {
    const links = [["list", "List", "first"], ["table", "Table", "last"]].map(([view, label, cls]) => {
      const on = st.view === view;
      return `<a class="${cls}${on ? " on" : ""}" href="${esc(st.url({ view }))}"` +
        (on ? ' aria-current="true"' : "") + `>${label}</a>`;
    });
    return '<p class="view-toggle">Show as: ' + links.join("") + "</p>";
  }

  function resultsTable(st, shown, suffix) {
    const th = (column, label) => {
      const on = st.sort.replace(/^-/, "") === column, down = st.sort.startsWith("-");
      const aria = on ? (down ? "descending" : "ascending") : "none";
      const arrow = on ? (down ? " ▼" : " ▲") : "";
      return `<th aria-sort="${aria}"><a href="${esc(st.url({ sort: nextSort(st.sort, column) }))}">` +
        `${label}${arrow}</a></th>`;
    };
    const rows = shown.map((r) =>
      `<tr><td><a href="#/macro/${r.id}${esc(suffix)}">${marked(r.title)}</a> ${statusBadge(r.macro)}</td>` +
      macroChips(st, r.macro, ["category", "group"]).map((c) => `<td>${c}</td>`).join("") +
      `<td class="updated">${esc(asText(r.macro.updated_at).slice(0, 10))}</td></tr>`).join("");
    return '<table class="results"><thead><tr>' + th("title", "Title") + th("category", "Category") +
      th("group", "Available for") + th("updated", "Updated") + `</tr></thead><tbody>${rows}</tbody></table>`;
  }

  function renderSearch(params) {
    const st = searchState(params);
    const results = search(st.q, st.filters, st.sort);
    const qs = searchQuery(st.q, st.filters, st.view, st.sort);
    const suffix = qs ? `?${qs}` : "";
    let hidden = FACETS.flatMap(([key]) => (st.filters[key] || []).map((v) =>
      `<input type="hidden" name="${key}" value="${esc(v)}">`)).join("");
    if (st.view === "table") hidden += '<input type="hidden" name="view" value="table">';
    const form =
      '<form class="search" id="search">' +
      `<input type="search" name="q" value="${esc(st.q)}" placeholder="Search titles, replies, and tags" autofocus>` +
      `${hidden}<button type="submit">Search</button></form>`;
    const shown = results.slice(0, MAX_RESULTS);
    const items = st.view === "table" ? (shown.length ? resultsTable(st, shown, suffix) : "") : shown.map((r) =>
      '<div class="result">' +
      `<h2><a href="#/macro/${r.id}${esc(suffix)}">${marked(r.title)}</a></h2>` +
      `<div class="meta">${[statusBadge(r.macro), ...macroChips(st, r.macro), zendeskLink(r.id)].join(" · ")}</div>` +
      (r.snippet ? `<p class="snippet">${marked(r.snippet)}</p>` : "") +
      "</div>").join("");
    let count = `${results.length} of ${index.macros.size} macros`;
    if (results.length > shown.length) count += ` (first ${shown.length} shown)`;
    const exported = exportLabel(index.exportedAt);
    if (exported) count += ` · ${exported}`;
    const legend = '<p class="legend"><span class="dc">{{pink}}</span> dynamic content · ' +
                   '<span class="fill">[[orange]]</span> replace before sending</p>';
    // Issue #18: add groups.json here, and the same search shows again.
    const notice = (index.groupNames.size ? "" :
      '<p class="notice">Group names are missing. Choose groups.json ' +
      '<input type="file" id="groups-file" accept=".json,application/json" aria-label="Choose groups.json">' +
      " or drag it onto this page.</p>") +
      (loadError ? `<p class="error">${esc(loadError)}</p>` : "");
    document.title = st.q ? `${st.q} - Zendesk macros` : "Zendesk macros";
    return `<h1>Zendesk macros</h1>${form}${selectedRow(st)}${tagPicker(st)}${viewToggle(st)}` +
           `<p class="count">${esc(count)}</p>${legend}${notice}` +
           items + '<p><button type="button" class="link" id="reload">Load other files</button></p>';
  }

  function renderValue(field, value) {
    if (field === "comment_value_html") return linked(htmlToText(asText(value)));
    if (field === "comment_value") return linked(asText(value));
    if (field === "group_id" && /^\d+$/.test(String(value))) {
      return esc(`${groupName(Number(value))} (${value})`);
    }
    return show(value);
  }

  function renderMacro(id, backQs) {
    const m = index.macros.get(id);
    const rows = actions(m).map((a) =>
      `<tr><th>${esc(a.field)}</th><td class="value">${renderValue(a.field, a.value)}</td></tr>`).join("");
    const reply = index.replies.get(id);
    document.title = `${m.title || ""} - Zendesk macros`;
    return `<p><a href="#/${esc(backQs ? "?" + backQs : "")}">Back to search</a></p>` +
      `<h1>${esc(m.title)}</h1>` +
      `<p class="meta">${statusBadge(m)} · ${esc(availableFor(m))} · ${zendeskLink(id)}<br>` +
      `Created ${esc(m.created_at)} · Updated ${esc(m.updated_at)} · ID ${esc(id)}</p>` +
      (m.description ? `<h2>Description</h2><p class="reply">${show(m.description)}</p>` : "") +
      (reply ? `<h2>Reply</h2><div class="reply">${linked(reply)}</div>` : "") +
      `<h2>Actions</h2><table>${rows}</table>` +
      '<details><summary>API JSON</summary><pre class="json">' + esc(JSON.stringify(m, null, 2)) +
      "</pre></details>";
  }

  // --- loading files ---------------------------------------------------------

  const loaded = { macros: null, groups: null };
  let loadError = "";
  let lastPage = "";  // the last search or macro page, to go back to after a load

  function renderLoad() {
    document.title = "Zendesk macros";
    const have = [loaded.macros && `macros.json (${loaded.macros.macros.length} macros)`,
                  loaded.groups && `groups.json (${loaded.groups.groups.length} groups)`].filter((x) => x);
    const prompt = loaded.macros && !loaded.groups
      ? "<p>Choose <b>groups.json</b> to add group names. The loaded macros stay.</p>"
      : "<p>Drag <b>macros.json</b> and <b>groups.json</b> here, or choose them:</p>";
    return '<h1>Zendesk macros</h1><div class="drop" id="drop">' + prompt +
      '<p><input type="file" id="files" accept=".json,application/json" multiple></p>' +
      (have.length ? `<p class="meta">Loaded: ${esc(have.join(", "))}</p>` : "") +
      (loaded.macros ? '<p><button type="button" id="show">Search the macros</button></p>' : "") +
      '<p class="meta">The files stay on this computer. This page sends nothing over the network.</p>' +
      (loadError ? `<p class="error">${esc(loadError)}</p>` : "") + "</div>";
  }

  function useDocuments(macrosDoc, groupsDoc) {
    index = buildIndex(macrosDoc.macros, groupsDoc ? groupsDoc.groups : [], macrosDoc.exported_at);
  }

  // With `groupsOnly`, a file that is not groups.json is an error (issue #18).
  async function loadFiles(files, groupsOnly = false) {
    // On a search or macro page, the page stays, with the same query and filters.
    const stay = index !== null && location.hash !== "#/load";
    const errors = [];
    for (const file of files) {
      try {
        const data = JSON.parse(await file.text());
        if (data && Array.isArray(data.groups)) loaded.groups = data;
        else if (data && Array.isArray(data.macros) && !groupsOnly) loaded.macros = data;
        else errors.push(`${file.name} is not ${groupsOnly ? "groups.json" : "macros.json or groups.json"}.`);
      } catch (e) {
        errors.push(`${file.name} is not a JSON file: ${e.message}`);
      }
    }
    loadError = errors.join("\n");
    if (loaded.macros) {
      useDocuments(loaded.macros, loaded.groups);
      if (stay) { route(true); return; }
      if (!errors.length) { location.hash = lastPage || "#/"; route(); return; }
    }
    render(renderLoad());
  }

  // --- routing and events ----------------------------------------------------

  const app = document.getElementById("app");

  function render(html) {
    app.innerHTML = html;
    const input = app.querySelector("input[type=search]");
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }

  function route(keepScroll = false) {
    if (!index || location.hash === "#/load") { render(renderLoad()); return; }
    lastPage = location.hash;
    const hash = location.hash.replace(/^#\/?/, "");
    const [path, query = ""] = hash.split(/\?(.*)/s);
    const params = new URLSearchParams(query);
    const detail = /^macro\/(\d+)$/.exec(path);
    if (detail && index.macros.has(Number(detail[1]))) {
      render(renderMacro(Number(detail[1]), query));
    } else {
      render(renderSearch(params));
    }
    if (!keepScroll) window.scrollTo(0, 0);
  }

  app.addEventListener("submit", (event) => {
    if (event.target.id !== "search") return;
    event.preventDefault();
    const data = new FormData(event.target);
    const qs = searchQuery(String(data.get("q") || ""), parseFilters(data), data.get("view") || "");
    location.hash = qs ? `#/?${qs}` : "#/";
  });
  app.addEventListener("change", (event) => {
    if (event.target.id === "files") loadFiles([...event.target.files]);
    if (event.target.id === "groups-file") loadFiles([...event.target.files], true);
  });
  app.addEventListener("click", (event) => {
    if (event.target.id === "reload") location.hash = "#/load";
    if (event.target.id === "show") location.hash = lastPage || "#/";
  });
  // Without these handlers, the browser opens a dropped file instead.
  window.addEventListener("dragover", (event) => {
    event.preventDefault();
    const drop = document.getElementById("drop");
    if (drop) drop.classList.add("over");
  });
  window.addEventListener("dragleave", () => {
    const drop = document.getElementById("drop");
    if (drop) drop.classList.remove("over");
  });
  window.addEventListener("drop", (event) => {
    event.preventDefault();
    if (event.dataTransfer && event.dataTransfer.files.length) loadFiles([...event.dataTransfer.files]);
  });
  // An error of the last load shows only until the next page.
  window.addEventListener("hashchange", () => { loadError = ""; route(); });

  // For test_macro_search_html.py. It reads nothing and sends nothing.
  window.macroSearchTest = Object.freeze({
    load(macrosDoc, groupsDoc) { useDocuments(macrosDoc, groupsDoc); },
    search(q, filters, sort) {
      return search(q, filters, sort).map((r) =>
        ({ id: r.id, title_html: marked(r.title), snippet_html: marked(r.snippet) }));
    },
    marked, htmlToText, linked, exportLabel,
    availableFor(id) { return availableFor(index.macros.get(id)); },
    groupChoices() { return groupChoices(); },
    fieldChoices() { return fieldChoices(); },
    categoryChoices() { return categoryChoices(); },
    facetChoices() { return facetChoices(); },
    parseFilters, parseSort, nextSort, searchQuery,
  });

  route();
})();
</script>
</body>
</html>
